<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALMSHORE — A Sun-Bleached Crime Story</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101b22; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #world { z-index: 1; }
  #hud { z-index: 2; }
  #boot {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 44%, #223c48 0%, #0c161c 70%);
    color: #f7efdc; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.18em; text-transform: uppercase; transition: opacity 240ms ease;
  }
  #boot .mark { font-family: "Arial Black", Impact, sans-serif; font-size: 34px; letter-spacing: 0.22em; }
  #boot .sub { margin-top: 10px; font-size: 11px; color: #ffc857; letter-spacing: 0.3em; }
  #boot.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world"></canvas>
  <canvas id="hud"></canvas>
</div>
<div id="boot"><div><div class="mark">PALMSHORE</div><div class="sub">LOADING THE STRIP · GOLDEN HOUR</div></div></div>
<script>window.addEventListener("error",function(e){window.__PALMSHORE_ERROR__=(e.message||"error")+" @ "+(e.filename||"?")+":"+(e.lineno||0);});window.addEventListener("unhandledrejection",function(e){window.__PALMSHORE_ERROR__=String(e.reason);});</script>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
